<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ladda ner högupplösta bilder</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background: #f5f5f5;
            text-align: center;
        }

        h2 {
            margin-bottom: 30px;
            font-weight: normal;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery a {
            display: block;
            text-decoration: none;
        }

        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>

    <h2>Klicka på bilderna för att ladda ner högupplöst .TIFF-version av bilderna.</h2>

    <div class="gallery">

        <a href="images/images_to_download/IMG_1.tiff" download>
            <img src="images/images_to_download/IMG_1.jpeg" alt="Bild 1">
        </a>

        <a href="images/images_to_download/IMG_2.tiff" download>
            <img src="images/images_to_download/IMG_2.jpeg" alt="Bild 2">
        </a>

        <a href="images/images_to_download/IMG_3.tiff" download>
            <img src="images/images_to_download/IMG_3.jpeg" alt="Bild 3">
        </a>

        <a href="images/images_to_download/IMG_4.tiff" download>
            <img src="images/images_to_download/IMG_4.jpeg" alt="Bild 4">
        </a>

    </div>

</body>
</html>
