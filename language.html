<!--
  Language switch for the website.

  Swedish is the default. English is shown when <html> has the class "lang-en".
  In the .qmd files:
    - Swedish text goes in  ::: sv  ...  :::   or  [text]{.sv}
    - English text goes in  ::: en  ...  :::   or  [text]{.en}
    - Anything outside these blocks (code, prompts, reference lists, images)
      is shown in both languages and is never translated.

  The visitor's choice is remembered between pages. A link ending in
  ?lang=en (for example jemstedt.se/research.html?lang=en) opens the
  English version directly.
-->
<style>
  html:not(.lang-en) .en,
  html.lang-en .sv {
    display: none !important;
  }

  .lang-switch {
    background: none;
    border: 0;
    display: inline-flex;
    align-items: center;
    gap: 0.35em;
    white-space: nowrap;
    cursor: pointer;
  }

  /* Quarto orders the navbar with flexbox: this puts the button at the far right */
  .lang-switch-item {
    display: flex;
    align-items: center;
    order: 1000;
    margin-left: 0.5rem;
  }

  /* On phones the button shows EN / SV so it fits on the same line as the name */
  .lang-switch-short {
    display: none;
  }

  @media (max-width: 991.98px) {
    .lang-switch-item {
      margin-left: 0.25rem;
    }

    .lang-switch.nav-link {
      padding: 0.1rem 0.45rem;
      border: 1px solid currentColor;
      border-radius: 0.3rem;
      font-size: 0.85rem;
    }

    .lang-switch .bi,
    .lang-switch-label {
      display: none;
    }

    .lang-switch-short {
      display: inline;
    }
  }

  /* Small phones: make room for the button next to the site name */
  @media (max-width: 385px) {
    .navbar-brand-container {
      max-width: calc(100% - 135px) !important;
    }

    .navbar-brand .navbar-title {
      font-size: 1rem;
    }
  }
</style>

<script>
  (function () {
    var KEY = "site-lang";
    var lang = "sv";

    try {
      var fromUrl = new URLSearchParams(window.location.search).get("lang");
      if (fromUrl === "en" || fromUrl === "sv") {
        lang = fromUrl;
        localStorage.setItem(KEY, lang);
      } else if (localStorage.getItem(KEY) === "en") {
        lang = "en";
      }
    } catch (e) {}

    // Set before the page is drawn, so the wrong language never flashes.
    document.documentElement.classList.toggle("lang-en", lang === "en");
    document.documentElement.lang = lang;

    // Interface texts that Quarto writes in Swedish (lang: sv in _quarto.yml).
    var UI_EN = {
      "På denna sida": "On this page",
      "Visa kod": "Show code",
      "Dölj kod": "Hide code",
      "Kod": "Code",
      "Kopiera till urklipp": "Copy to Clipboard"
    };

    function swapText(el, attr) {
      var key = attr ? "svAttr" : "svText";
      if (!(key in el.dataset)) {
        el.dataset[key] = attr ? el.getAttribute(attr) : el.textContent.trim();
      }
      var sv = el.dataset[key];
      var value = lang === "en" && UI_EN[sv] ? UI_EN[sv] : sv;
      if (attr) {
        el.setAttribute(attr, value);
      } else {
        el.textContent = value;
      }
    }

    var originalTitle = document.title;

    function apply() {
      var html = document.documentElement;
      html.classList.toggle("lang-en", lang === "en");
      html.lang = lang;

      document.querySelectorAll("#toc-title, details.code-fold > summary").forEach(function (el) {
        swapText(el);
      });
      document.querySelectorAll(".code-copy-button[title]").forEach(function (el) {
        swapText(el, "title");
      });

      // Browser tab title
      var sv = document.querySelector("h1.title .sv");
      var en = document.querySelector("h1.title .en");
      document.title = lang === "en" && sv && en
        ? originalTitle.replace(sv.textContent.trim(), en.textContent.trim())
        : originalTitle;

      // Button label shows the language you can switch to
      var btn = document.querySelector(".lang-switch");
      if (btn) {
        var label = btn.querySelector(".lang-switch-label");
        var short = btn.querySelector(".lang-switch-short");
        label.textContent = lang === "en" ? "Svenska" : "English";
        short.textContent = lang === "en" ? "SV" : "EN";
        btn.lang = lang === "en" ? "sv" : "en";
        btn.setAttribute("aria-label", lang === "en" ? "Byt till svenska" : "Switch to English");
      }
    }

    function addButton() {
      var item = document.createElement("div");
      item.className = "lang-switch-item";
      item.innerHTML =
        '<button type="button" class="nav-link lang-switch">' +
        '<i class="bi bi-translate" aria-hidden="true"></i>' +
        '<span class="lang-switch-label"></span>' +
        '<span class="lang-switch-short"></span></button>';

      // Next to the search icon, so it is visible on phones without opening the menu
      var search = document.getElementById("quarto-search");
      var toggler = document.querySelector(".navbar .navbar-toggler");
      var anchor = search || toggler;
      if (anchor) {
        anchor.parentNode.insertBefore(item, anchor);
      } else {
        var nav = document.querySelector(".navbar .navbar-container") || document.body;
        nav.appendChild(item);
      }

      item.querySelector("button").addEventListener("click", function () {
        lang = lang === "en" ? "sv" : "en";
        try {
          localStorage.setItem(KEY, lang);
          var url = new URL(window.location.href);
          if (lang === "en") {
            url.searchParams.set("lang", "en");
          } else {
            url.searchParams.delete("lang");
          }
          history.replaceState(null, "", url);
        } catch (e) {}
        apply();
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      // Mark each language block so screen readers pronounce it correctly
      document.querySelectorAll(".sv").forEach(function (el) { el.lang = "sv"; });
      document.querySelectorAll(".en").forEach(function (el) { el.lang = "en"; });
      addButton();
      apply();
    });

    // Quarto adds copy buttons after page load
    window.addEventListener("load", apply);
  })();
</script>
